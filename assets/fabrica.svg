<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 162" width="220" height="162">
  <!-- Fábrica (porta à esquerda, onde o ajudante entra) -->
  <g stroke="#222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- Fumaça -->
    <circle cx="178" cy="18" r="9" fill="#e6e6e6"/>
    <circle cx="194" cy="9" r="6" fill="#e6e6e6"/>
    <!-- Chaminé -->
    <rect x="160" y="34" width="26" height="40" fill="#9b4a3a"/>
    <rect x="156" y="28" width="34" height="10" rx="2" fill="#7a3a2e"/>

    <!-- Telhado em serra -->
    <path d="M8 64 L8 40 L58 64 L58 40 L108 64 L108 40 L158 64 Z" fill="#7d848c"/>

    <!-- Prédio -->
    <rect x="8" y="62" width="204" height="96" fill="#d9644a"/>
    <!-- Tijolinhos -->
    <g stroke="#a8432f" stroke-width="3">
      <line x1="90" y1="76" x2="110" y2="76"/>
      <line x1="180" y1="78" x2="200" y2="78"/>
      <line x1="140" y1="72" x2="156" y2="72"/>
    </g>

    <!-- Porta grande (entrada do minério) -->
    <rect x="20" y="96" width="58" height="62" fill="#5f6870"/>
    <g stroke="#3e454c" stroke-width="3">
      <line x1="22" y1="110" x2="76" y2="110"/>
      <line x1="22" y1="124" x2="76" y2="124"/>
      <line x1="22" y1="138" x2="76" y2="138"/>
    </g>
    <rect x="20" y="96" width="58" height="62" fill="none"/>

    <!-- Janelas -->
    <rect x="98" y="84" width="40" height="28" rx="3" fill="#8fd3f4"/>
    <rect x="154" y="84" width="40" height="28" rx="3" fill="#8fd3f4"/>
    <line x1="118" y1="84" x2="118" y2="112" stroke-width="3"/>
    <line x1="174" y1="84" x2="174" y2="112" stroke-width="3"/>

    <!-- Placa -->
    <rect x="96" y="122" width="102" height="28" rx="6" fill="#f7c21b"/>
    <circle cx="112" cy="136" r="8" fill="#f7c21b" stroke-width="3"/>
  </g>
  <text x="112" y="141" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="13" font-weight="900" fill="#8a5a00">$</text>
  <text x="156" y="141" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="14" font-weight="900" fill="#222">FÁBRICA</text>
</svg>
