<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" width="960" height="230">
  <!-- Bloco da SUPERFÍCIE (960 x 230): céu, grama, boca do poço e torre do elevador.
       Os andares (fundo-andar.svg) são empilhados logo abaixo, a partir de y 230. -->

  <!-- Céu -->
  <rect x="0" y="0" width="960" height="200" fill="#8fd3f4"/>
  <!-- Nuvens -->
  <g fill="#ffffff" stroke="#222" stroke-width="4" stroke-linejoin="round">
    <path d="M500 60 Q500 40 525 42 Q535 24 560 32 Q580 26 585 46 Q605 48 602 62 Z"/>
    <path d="M600 128 Q600 110 622 112 Q632 96 655 104 Q672 100 676 116 Q694 118 692 130 Z"/>
  </g>

  <!-- Terra -->
  <rect x="0" y="190" width="960" height="40" fill="#9b6635"/>

  <!-- Grama -->
  <path d="M0 186 H960 V204 Q930 214 900 204 Q870 214 840 204 Q810 214 780 204 Q750 214 720 204 Q690 214 660 204 Q630 214 600 204 Q570 214 540 204 Q510 214 480 204 Q450 214 420 204 Q390 214 360 204 Q330 214 300 204 Q270 214 240 204 Q210 214 180 204 Q150 214 120 204 Q90 214 60 204 Q30 214 0 204 Z"
        fill="#5cb83a" stroke="#222" stroke-width="4" stroke-linejoin="round"/>

  <!-- Boca do poço (continua nos blocos dos andares) -->
  <rect x="136" y="196" width="118" height="34" fill="#2e1f12"/>
  <g stroke="#7d848c" stroke-width="5">
    <line x1="148" y1="200" x2="148" y2="230"/>
    <line x1="242" y1="200" x2="242" y2="230"/>
  </g>
  <g stroke="#222" stroke-width="5" stroke-linecap="square">
    <line x1="136" y1="196" x2="254" y2="196"/>
    <line x1="136" y1="196" x2="136" y2="230"/>
    <line x1="254" y1="196" x2="254" y2="230"/>
  </g>

  <!-- Torre do elevador -->
  <g fill="#b07a3e" stroke="#222" stroke-width="4" stroke-linejoin="round">
    <path d="M132 196 L158 110 L172 110 L150 196 Z"/>
    <path d="M258 196 L232 110 L218 110 L240 196 Z"/>
    <rect x="150" y="102" width="90" height="16"/>
  </g>
  <!-- Roldana -->
  <circle cx="195" cy="98" r="18" fill="#9aa3ad" stroke="#222" stroke-width="4"/>
  <circle cx="195" cy="98" r="5" fill="#222"/>
</svg>
