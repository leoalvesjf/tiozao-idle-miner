<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250">
  <!-- Bloco de UM ANDAR da mina (960 x 250). Repete um embaixo do outro.
       Túnel: x 230-900, y 20-240. Chão em y 220. Poço do elevador: x 136-254 (altura toda). -->

  <!-- Terra -->
  <rect x="0" y="0" width="960" height="250" fill="#9b6635"/>
  <!-- Pedrinhas -->
  <g fill="#b98a5a" stroke="#222" stroke-width="3" stroke-linejoin="round">
    <ellipse cx="930" cy="70" rx="10" ry="7"/>
    <ellipse cx="925" cy="190" rx="12" ry="8"/>
    <ellipse cx="40" cy="220" rx="10" ry="7"/>
  </g>

  <!-- ===== Túnel ===== -->
  <rect x="230" y="20" width="670" height="220" rx="24" fill="#4a2f18" stroke="#222" stroke-width="5"/>
  <!-- Chão do túnel -->
  <rect x="234" y="220" width="662" height="16" fill="#5e3c1f"/>
  <line x1="234" y1="220" x2="896" y2="220" stroke="#222" stroke-width="4"/>

  <!-- Parede de escavação (direita) -->
  <path d="M898 40 L796 40 Q778 62 792 84 Q768 106 786 132 Q762 158 784 182 Q770 202 780 220 L898 220 Z"
        fill="#a87444" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
  <g fill="none" stroke="#5e3c1f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M796 90 L818 102 L832 96"/>
    <path d="M790 154 L812 160 L820 174"/>
    <path d="M824 122 L840 130"/>
  </g>
  <g stroke="#222" stroke-width="3" stroke-linejoin="round">
    <path d="M820 60 L836 54 L846 66 L832 74 Z" fill="#8a8f98"/>
    <path d="M846 140 L862 134 L870 148 L854 154 Z" fill="#8a8f98"/>
    <path d="M808 196 L822 190 L830 202 L816 208 Z" fill="#8a8f98"/>
    <path d="M840 94 L850 90 L854 100 L844 104 Z" fill="#f7c21b"/>
    <path d="M816 130 L824 126 L828 134 L820 138 Z" fill="#f7c21b"/>
    <path d="M852 182 L860 178 L864 186 L856 190 Z" fill="#f7c21b"/>
  </g>
  <path d="M756 220 Q768 206 782 212 Q792 202 802 220 Z" fill="#a87444" stroke="#222" stroke-width="3" stroke-linejoin="round"/>

  <!-- Vigas de madeira -->
  <g fill="#b07a3e" stroke="#222" stroke-width="4" stroke-linejoin="round">
    <rect x="254" y="22" width="636" height="20"/>
    <rect x="470" y="40" width="18" height="182"/>
    <rect x="670" y="40" width="18" height="182"/>
  </g>
  <!-- Lampiões -->
  <g stroke="#222">
    <line x1="370" y1="42" x2="370" y2="60" stroke-width="3"/>
    <rect x="360" y="60" width="20" height="26" rx="5" fill="#fff6a0" stroke-width="4"/>
    <line x1="580" y1="42" x2="580" y2="60" stroke-width="3"/>
    <rect x="570" y="60" width="20" height="26" rx="5" fill="#fff6a0" stroke-width="4"/>
  </g>

  <!-- ===== Poço do elevador (atravessa o bloco inteiro) ===== -->
  <rect x="136" y="0" width="118" height="250" fill="#2e1f12"/>
  <g stroke="#7d848c" stroke-width="5">
    <line x1="148" y1="0" x2="148" y2="250"/>
    <line x1="242" y1="0" x2="242" y2="250"/>
  </g>
  <g stroke="#222" stroke-width="5">
    <line x1="136" y1="0" x2="136" y2="250"/>
    <line x1="254" y1="0" x2="254" y2="250"/>
  </g>
  <!-- Plataforma do andar (onde o elevador para) -->
  <rect x="136" y="220" width="118" height="10" fill="#5e3c1f" stroke="#222" stroke-width="3"/>
</svg>
