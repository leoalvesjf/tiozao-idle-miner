<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Gerente: retrato em medalhão (para a barra lateral) -->
  <defs>
    <clipPath id="recorte">
      <circle cx="50" cy="50" r="44"/>
    </clipPath>
  </defs>

  <!-- Fundo do medalhão -->
  <circle cx="50" cy="50" r="46" fill="#fff3c4"/>

  <g clip-path="url(#recorte)" stroke="#222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- Terno -->
    <path d="M10 104 Q12 72 50 70 Q88 72 90 104 Z" fill="#3b4a6b"/>
    <!-- Camisa -->
    <path d="M40 71 L50 88 L60 71 Z" fill="#ffffff"/>
    <!-- Gravata -->
    <path d="M47 76 L53 76 L56 94 L50 100 L44 94 Z" fill="#d94a3a"/>

    <!-- Orelhas e cabeça -->
    <circle cx="30" cy="47" r="5" fill="#f5c38b" stroke-width="3"/>
    <circle cx="70" cy="47" r="5" fill="#f5c38b" stroke-width="3"/>
    <circle cx="50" cy="46" r="20" fill="#f5c38b"/>
    <!-- Cabelo grisalho penteado -->
    <path d="M30 44 Q28 22 50 22 Q72 22 70 44 Q66 32 54 32 Q42 30 30 44 Z" fill="#8a8f98"/>
    <!-- Óculos -->
    <circle cx="43" cy="47" r="6" fill="#ffffff" stroke-width="3"/>
    <circle cx="57" cy="47" r="6" fill="#ffffff" stroke-width="3"/>
    <line x1="49" y1="47" x2="51" y2="47" stroke-width="3"/>
    <circle cx="43" cy="47" r="2" fill="#222" stroke="none"/>
    <circle cx="57" cy="47" r="2" fill="#222" stroke="none"/>
    <!-- Bigode -->
    <path d="M40 58 Q50 53 60 58 Q56 63 50 60 Q44 63 40 58 Z" fill="#8a8f98" stroke-width="3"/>
  </g>

  <!-- Borda do medalhão -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#222" stroke-width="4"/>
</svg>
