<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180">
  <!-- Mineiro de PERFIL: pose PARADO (virado para a direita) -->
  <g stroke="#222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- Perna de trás (mais escura) -->
    <rect x="58" y="128" width="18" height="34" fill="#2559a8"/>
    <rect x="54" y="156" width="30" height="16" rx="5" fill="#47301a"/>
    <!-- Perna da frente -->
    <rect x="68" y="128" width="18" height="34" fill="#2f6fd1"/>
    <rect x="64" y="156" width="32" height="16" rx="5" fill="#5a3a1e"/>

    <!-- Camisa -->
    <rect x="50" y="86" width="46" height="52" rx="12" fill="#e8d5b0"/>
    <!-- Macacão -->
    <path d="M50 112 H96 V132 Q96 142 86 142 H60 Q50 142 50 132 Z" fill="#2f6fd1"/>
    <rect x="80" y="96" width="16" height="18" rx="3" fill="#2f6fd1"/>
    <path d="M56 88 Q70 90 84 98" fill="none" stroke="#222" stroke-width="10"/>
    <path d="M56 88 Q70 90 84 98" fill="none" stroke="#2f6fd1" stroke-width="5"/>
    <circle cx="89" cy="104" r="3" fill="#f7c21b" stroke-width="2"/>

    <!-- Cabeça e orelha -->
    <circle cx="71" cy="62" r="24" fill="#f5c38b"/>
    <circle cx="63" cy="65" r="6" fill="#f5c38b" stroke-width="3"/>
    <!-- Olho -->
    <circle cx="83" cy="58" r="3.5" fill="#222" stroke="none"/>
    <!-- Bigode -->
    <path d="M72 74 Q84 66 98 73 Q102 80 93 80 Q85 76 79 80 Q68 81 72 74 Z" fill="#6b3e1f"/>
    <!-- Nariz -->
    <circle cx="95" cy="66" r="6" fill="#f5c38b"/>

    <!-- Capacete -->
    <path d="M44 54 A27 27 0 0 1 98 54 Z" fill="#f7c21b"/>
    <rect x="42" y="50" width="66" height="8" rx="4" fill="#f7c21b"/>
    <!-- Lanterna -->
    <rect x="92" y="36" width="11" height="13" rx="3" fill="#d9d9d9"/>
    <circle cx="103" cy="42.5" r="4" fill="#fff6a0" stroke-width="2.5"/>

    <!-- Picareta (apoiada, em pé) -->
    <g transform="translate(104 126) rotate(30)">
      <line x1="0" y1="14" x2="0" y2="-66" stroke="#222" stroke-width="11"/>
      <line x1="0" y1="14" x2="0" y2="-66" stroke="#a0662b" stroke-width="6"/>
      <path d="M-26 -58 Q0 -86 26 -58 Q0 -72 -26 -58 Z" fill="#9aa3ad"/>
    </g>

    <!-- Braço e mão -->
    <path d="M76 96 L104 126" stroke="#222" stroke-width="16"/>
    <path d="M76 96 L104 126" stroke="#f5c38b" stroke-width="9"/>
    <circle cx="104" cy="126" r="8" fill="#f5c38b"/>
  </g>
</svg>
