<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Moeda -->
  <g stroke="#222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- Borda (lateral da moeda) -->
    <circle cx="32" cy="34" r="26" fill="#c98a0c"/>
    <!-- Face -->
    <circle cx="32" cy="30" r="26" fill="#f7c21b"/>
    <!-- Anel interno -->
    <circle cx="32" cy="30" r="18" fill="none" stroke="#d99a10" stroke-width="3"/>
    <!-- Brilho -->
    <path d="M16 22 Q20 12 30 10" fill="none" stroke="#fff6a0" stroke-width="4"/>
  </g>
  <!-- Símbolo $ -->
  <text x="32" y="40" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="28" font-weight="900" fill="#8a5a00">$</text>
</svg>
