<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" width="100" height="110">
  <!-- Cabine do elevador: CHEIA de minério -->
  <g stroke="#222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- Gancho do cabo -->
    <line x1="50" y1="0" x2="50" y2="10" stroke-width="3"/>
    <circle cx="50" cy="10" r="4" fill="#9aa3ad" stroke-width="3"/>

    <!-- Parede do fundo -->
    <rect x="14" y="22" width="72" height="76" fill="#4a5058"/>
    <!-- Grades -->
    <g stroke="#7d848c" stroke-width="3">
      <line x1="32" y1="26" x2="32" y2="72"/>
      <line x1="50" y1="26" x2="50" y2="72"/>
      <line x1="68" y1="26" x2="68" y2="72"/>
    </g>

    <!-- Monte de minério (passando da mureta) -->
    <path d="M14 76 Q22 52 38 54 Q46 40 60 46 Q74 44 86 76 Z" fill="#8a8f98"/>
    <path d="M30 60 L38 54 L44 62 L36 66 Z" fill="#6c717a" stroke-width="3"/>
    <path d="M60 52 L70 50 L72 60 L62 62 Z" fill="#6c717a" stroke-width="3"/>
    <!-- Pepitas de ouro -->
    <path d="M46 50 L54 46 L58 54 L50 58 Z" fill="#f7c21b" stroke-width="3"/>
    <path d="M24 66 L30 62 L34 68 L28 72 Z" fill="#f7c21b" stroke-width="3"/>
    <path d="M70 64 L76 60 L80 68 L74 72 Z" fill="#f7c21b" stroke-width="3"/>
    <circle cx="51" cy="50" r="1.6" fill="#fff6a0" stroke="none"/>

    <!-- Laterais -->
    <rect x="8" y="22" width="9" height="78" fill="#9aa3ad"/>
    <rect x="83" y="22" width="9" height="78" fill="#9aa3ad"/>
    <!-- Viga de cima -->
    <rect x="4" y="12" width="92" height="13" rx="3" fill="#7d848c"/>

    <!-- Mureta da frente (amarela com faixas) -->
    <rect x="8" y="72" width="84" height="26" fill="#f7c21b"/>
    <g stroke="#222" stroke-width="5">
      <line x1="22" y1="96" x2="34" y2="74"/>
      <line x1="44" y1="96" x2="56" y2="74"/>
      <line x1="66" y1="96" x2="78" y2="74"/>
    </g>
    <rect x="8" y="72" width="84" height="26" fill="none"/>

    <!-- Piso -->
    <rect x="4" y="96" width="92" height="10" rx="3" fill="#5a3a1e"/>
  </g>
</svg>
