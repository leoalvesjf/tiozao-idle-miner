<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180">
  <!-- Mineiro: pose TRABALHANDO (golpe da picareta) -->
  <g stroke="#222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- Pernas -->
    <rect x="48" y="128" width="20" height="34" fill="#2f6fd1"/>
    <rect x="74" y="128" width="20" height="34" fill="#2f6fd1"/>
    <!-- Botas -->
    <rect x="44" y="156" width="27" height="16" rx="5" fill="#5a3a1e"/>
    <rect x="72" y="156" width="27" height="16" rx="5" fill="#5a3a1e"/>

    <!-- Camisa -->
    <rect x="44" y="86" width="54" height="52" rx="12" fill="#e8d5b0"/>
    <!-- Macacão -->
    <path d="M44 112 H98 V132 Q98 142 88 142 H54 Q44 142 44 132 Z" fill="#2f6fd1"/>
    <rect x="56" y="98" width="30" height="16" fill="#2f6fd1"/>
    <rect x="50" y="86" width="7" height="16" fill="#2f6fd1"/>
    <rect x="85" y="86" width="7" height="16" fill="#2f6fd1"/>
    <circle cx="61" cy="104" r="3" fill="#f7c21b" stroke-width="2"/>
    <circle cx="81" cy="104" r="3" fill="#f7c21b" stroke-width="2"/>

    <!-- Orelha e cabeça -->
    <circle cx="51" cy="66" r="6" fill="#f5c38b"/>
    <circle cx="71" cy="62" r="24" fill="#f5c38b"/>
    <!-- Olho (concentrado) -->
    <path d="M76 58 L84 57" stroke="#222" stroke-width="3.5"/>
    <!-- Bigode -->
    <path d="M70 74 Q82 66 96 73 Q100 80 91 80 Q83 76 77 80 Q66 81 70 74 Z" fill="#6b3e1f"/>
    <!-- Nariz -->
    <circle cx="92" cy="66" r="6" fill="#f5c38b"/>

    <!-- Capacete -->
    <path d="M44 54 A27 27 0 0 1 98 54 Z" fill="#f7c21b"/>
    <rect x="40" y="50" width="64" height="8" rx="4" fill="#f7c21b"/>
    <!-- Lanterna -->
    <rect x="90" y="36" width="11" height="13" rx="3" fill="#d9d9d9"/>
    <circle cx="101" cy="42.5" r="4" fill="#fff6a0" stroke-width="2.5"/>

    <!-- Picareta (golpeando para frente) -->
    <g transform="translate(108 108) rotate(95)">
      <line x1="0" y1="14" x2="0" y2="-66" stroke="#222" stroke-width="11"/>
      <line x1="0" y1="14" x2="0" y2="-66" stroke="#a0662b" stroke-width="6"/>
      <path d="M-26 -58 Q0 -86 26 -58 Q0 -72 -26 -58 Z" fill="#9aa3ad"/>
    </g>

    <!-- Linhas de movimento -->
    <path d="M150 70 Q168 72 180 84" fill="none" stroke-width="3"/>
    <path d="M146 82 Q160 84 168 92" fill="none" stroke-width="3"/>

    <!-- Braço e mão -->
    <path d="M86 96 L108 108" stroke="#222" stroke-width="16"/>
    <path d="M86 96 L108 108" stroke="#f5c38b" stroke-width="9"/>
    <circle cx="108" cy="108" r="8" fill="#f5c38b"/>
  </g>
</svg>
