<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <!-- Fundo V2 (960 x 540): superfície maior, poço do elevador à esquerda, túnel embaixo -->

  <!-- Céu -->
  <rect x="0" y="0" width="960" height="200" fill="#8fd3f4"/>
  <!-- Nuvens -->
  <g fill="#ffffff" stroke="#222" stroke-width="4" stroke-linejoin="round">
    <path d="M330 70 Q330 50 355 52 Q365 34 390 42 Q410 36 415 56 Q435 58 432 72 Z"/>
    <path d="M560 110 Q560 92 582 94 Q592 78 615 86 Q632 82 636 98 Q654 100 652 112 Z"/>
  </g>

  <!-- Terra -->
  <rect x="0" y="190" width="960" height="350" fill="#9b6635"/>
  <!-- Camada mais escura no fundo -->
  <path d="M0 500 Q260 486 500 504 Q740 520 960 498 V540 H0 Z" fill="#74461f"/>
  <!-- Faixa escura entre a grama e o túnel -->
  <path d="M174 236 Q400 222 600 240 Q800 254 960 232 V256 Q800 276 600 262 Q400 246 174 258 Z" fill="#875528"/>

  <!-- Pedrinhas na terra -->
  <g fill="#b98a5a" stroke="#222" stroke-width="3" stroke-linejoin="round">
    <ellipse cx="300" cy="225" rx="10" ry="7"/>
    <ellipse cx="520" cy="215" rx="9" ry="6"/>
    <ellipse cx="760" cy="222" rx="11" ry="7"/>
    <ellipse cx="930" cy="330" rx="10" ry="7"/>
    <ellipse cx="930" cy="440" rx="12" ry="8"/>
    <ellipse cx="400" cy="518" rx="12" ry="7"/>
    <ellipse cx="700" cy="522" rx="10" ry="6"/>
    <ellipse cx="25" cy="300" rx="10" ry="7"/>
    <ellipse cx="25" cy="430" rx="12" ry="8"/>
  </g>

  <!-- Grama -->
  <path d="M0 186 H960 V204 Q930 214 900 204 Q870 214 840 204 Q810 214 780 204 Q750 214 720 204 Q690 214 660 204 Q630 214 600 204 Q570 214 540 204 Q510 214 480 204 Q450 214 420 204 Q390 214 360 204 Q330 214 300 204 Q270 214 240 204 Q210 214 180 204 Q150 214 120 204 Q90 214 60 204 Q30 214 0 204 Z"
        fill="#5cb83a" stroke="#222" stroke-width="4" stroke-linejoin="round"/>

  <!-- ===== Túnel ===== -->
  <rect x="150" y="270" width="750" height="220" rx="24" fill="#4a2f18" stroke="#222" stroke-width="5"/>
  <!-- Chão do túnel -->
  <rect x="154" y="470" width="742" height="16" fill="#5e3c1f"/>
  <line x1="154" y1="470" x2="896" y2="470" stroke="#222" stroke-width="4"/>

  <!-- Parede de escavação (direita) -->
  <path d="M898 290 L796 290 Q778 312 792 334 Q768 356 786 382 Q762 408 784 432 Q770 452 780 470 L898 470 Z"
        fill="#a87444" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
  <g fill="none" stroke="#5e3c1f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M796 340 L818 352 L832 346"/>
    <path d="M790 404 L812 410 L820 424"/>
    <path d="M824 372 L840 380"/>
  </g>
  <g stroke="#222" stroke-width="3" stroke-linejoin="round">
    <path d="M820 310 L836 304 L846 316 L832 324 Z" fill="#8a8f98"/>
    <path d="M846 390 L862 384 L870 398 L854 404 Z" fill="#8a8f98"/>
    <path d="M808 446 L822 440 L830 452 L816 458 Z" fill="#8a8f98"/>
    <path d="M840 344 L850 340 L854 350 L844 354 Z" fill="#f7c21b"/>
    <path d="M816 380 L824 376 L828 384 L820 388 Z" fill="#f7c21b"/>
    <path d="M852 432 L860 428 L864 436 L856 440 Z" fill="#f7c21b"/>
  </g>
  <path d="M756 470 Q768 456 782 462 Q792 452 802 470 Z" fill="#a87444" stroke="#222" stroke-width="3" stroke-linejoin="round"/>

  <!-- Vigas de madeira do túnel -->
  <g fill="#b07a3e" stroke="#222" stroke-width="4" stroke-linejoin="round">
    <rect x="174" y="272" width="716" height="20"/>
    <rect x="420" y="290" width="18" height="182"/>
    <rect x="640" y="290" width="18" height="182"/>
  </g>
  <!-- Lampiões -->
  <g stroke="#222">
    <line x1="300" y1="292" x2="300" y2="310" stroke-width="3"/>
    <rect x="290" y="310" width="20" height="26" rx="5" fill="#fff6a0" stroke-width="4"/>
    <line x1="540" y1="292" x2="540" y2="310" stroke-width="3"/>
    <rect x="530" y="310" width="20" height="26" rx="5" fill="#fff6a0" stroke-width="4"/>
  </g>

  <!-- ===== Poço do elevador (esquerda) ===== -->
  <rect x="56" y="196" width="118" height="294" fill="#2e1f12" stroke="#222" stroke-width="5"/>
  <!-- Trilhos -->
  <g stroke="#7d848c" stroke-width="5">
    <line x1="68" y1="200" x2="68" y2="486"/>
    <line x1="162" y1="200" x2="162" y2="486"/>
  </g>
  <!-- Base do poço -->
  <rect x="56" y="470" width="118" height="20" fill="#5e3c1f" stroke="#222" stroke-width="4"/>

  <!-- Torre do elevador (superfície) -->
  <g fill="#b07a3e" stroke="#222" stroke-width="4" stroke-linejoin="round">
    <path d="M52 196 L78 110 L92 110 L70 196 Z"/>
    <path d="M178 196 L152 110 L138 110 L160 196 Z"/>
    <rect x="70" y="102" width="90" height="16"/>
    <rect x="76" y="150" width="78" height="10"/>
  </g>
  <!-- Roldana -->
  <circle cx="115" cy="98" r="18" fill="#9aa3ad" stroke="#222" stroke-width="4"/>
  <circle cx="115" cy="98" r="5" fill="#222"/>
  <!-- O cabo agora é uma peça do jogo (estica e encolhe com a cabine) -->
</svg>
