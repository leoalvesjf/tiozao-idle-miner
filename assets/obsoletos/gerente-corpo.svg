<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 120" width="90" height="120">
  <!-- Gerente de CORPO INTEIRO (de frente), com prancheta. Fica parado no posto da estação. -->
  <g stroke="#222" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Pernas e sapatos -->
    <rect x="29" y="84" width="14" height="26" fill="#2d3550"/>
    <rect x="47" y="84" width="14" height="26" fill="#2d3550"/>
    <rect x="25" y="106" width="20" height="9" rx="4" fill="#222"/>
    <rect x="45" y="106" width="20" height="9" rx="4" fill="#222"/>

    <!-- Braço esquerdo (atrás, ao lado do corpo) -->
    <path d="M22 54 L16 82" stroke="#222" stroke-width="12"/>
    <path d="M22 54 L16 82" stroke="#3b4a6b" stroke-width="7"/>
    <circle cx="16" cy="84" r="5" fill="#f5c38b"/>

    <!-- Paletó -->
    <path d="M20 54 Q22 44 45 42 Q68 44 70 54 L72 90 L18 90 Z" fill="#3b4a6b"/>
    <!-- Camisa e gravata -->
    <path d="M37 44 L45 62 L53 44 Z" fill="#ffffff"/>
    <path d="M43 48 L47 48 L49 66 L45 70 L41 66 Z" fill="#d94a3a" stroke-width="2.5"/>
    <!-- Botões do paletó -->
    <circle cx="45" cy="76" r="2" fill="#f7c21b" stroke="none"/>
    <circle cx="45" cy="84" r="2" fill="#f7c21b" stroke="none"/>

    <!-- Prancheta na mão direita -->
    <rect x="54" y="58" width="24" height="30" rx="3" fill="#b07a3e"/>
    <rect x="58" y="64" width="16" height="20" fill="#ffffff" stroke-width="2"/>
    <g stroke="#8a8f98" stroke-width="2">
      <line x1="61" y1="69" x2="71" y2="69"/>
      <line x1="61" y1="74" x2="71" y2="74"/>
      <line x1="61" y1="79" x2="68" y2="79"/>
    </g>
    <rect x="62" y="55" width="8" height="5" rx="1" fill="#9aa3ad" stroke-width="2"/>
    <circle cx="56" cy="74" r="5" fill="#f5c38b"/>

    <!-- Orelhas e cabeça -->
    <circle cx="29" cy="27" r="4" fill="#f5c38b" stroke-width="2.5"/>
    <circle cx="61" cy="27" r="4" fill="#f5c38b" stroke-width="2.5"/>
    <circle cx="45" cy="26" r="16" fill="#f5c38b"/>
    <!-- Cabelo grisalho -->
    <path d="M29 24 Q28 8 45 8 Q62 8 61 24 Q56 15 47 16 Q36 15 29 24 Z" fill="#8a8f98"/>
    <!-- Óculos -->
    <circle cx="39" cy="27" r="5" fill="#ffffff" stroke-width="2.5"/>
    <circle cx="51" cy="27" r="5" fill="#ffffff" stroke-width="2.5"/>
    <line x1="44" y1="27" x2="46" y2="27" stroke-width="2.5"/>
    <circle cx="39" cy="27" r="1.8" fill="#222" stroke="none"/>
    <circle cx="51" cy="27" r="1.8" fill="#222" stroke="none"/>
    <!-- Bigode -->
    <path d="M37 36 Q45 32 53 36 Q50 40 45 38 Q40 40 37 36 Z" fill="#8a8f98" stroke-width="2.5"/>
  </g>
</svg>
