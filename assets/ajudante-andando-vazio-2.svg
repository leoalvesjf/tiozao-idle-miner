<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180">
  <!-- Ajudante de PERFIL (virado para a direita): ANDANDO com carrinho VAZIO, quadro 2 -->
  <g stroke="#222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- Pernas (andando) -->
    <g transform="rotate(-22 52 128)">
      <rect x="43" y="126" width="18" height="34" fill="#2b7d44"/>
      <rect x="39" y="154" width="32" height="16" rx="5" fill="#47301a"/>
    </g>
    <g transform="rotate(22 52 128)">
      <rect x="43" y="126" width="18" height="34" fill="#3aa35a"/>
      <rect x="39" y="154" width="32" height="16" rx="5" fill="#5a3a1e"/>
    </g>

    <!-- Camisa e macacão verde -->
    <rect x="30" y="86" width="46" height="52" rx="12" fill="#f4f4f4"/>
    <path d="M30 112 H76 V132 Q76 142 66 142 H40 Q30 142 30 132 Z" fill="#3aa35a"/>
    <rect x="60" y="96" width="16" height="18" rx="3" fill="#3aa35a"/>
    <path d="M36 88 Q50 90 64 98" fill="none" stroke="#222" stroke-width="10"/>
    <path d="M36 88 Q50 90 64 98" fill="none" stroke="#3aa35a" stroke-width="5"/>
    <circle cx="69" cy="104" r="3" fill="#f7c21b" stroke-width="2"/>

    <!-- Cabeça, orelha, olho, sorriso e nariz -->
    <circle cx="51" cy="62" r="24" fill="#f5c38b"/>
    <circle cx="43" cy="65" r="6" fill="#f5c38b" stroke-width="3"/>
    <circle cx="63" cy="58" r="3.5" fill="#222" stroke="none"/>
    <path d="M60 77 Q67 82 74 76" fill="none" stroke-width="3"/>
    <circle cx="75" cy="66" r="6" fill="#f5c38b"/>

    <!-- Boné vermelho -->
    <path d="M27 56 Q27 32 51 32 Q75 32 75 56 Z" fill="#d94a3a"/>
    <path d="M68 50 Q86 50 96 55 L96 60 L68 60 Z" fill="#d94a3a"/>
    <circle cx="51" cy="32" r="3" fill="#d94a3a" stroke-width="2"/>

    <!-- Carrinho de mão -->
    <circle cx="176" cy="158" r="13" fill="#555"/>
    <circle cx="176" cy="158" r="4" fill="#bbb" stroke-width="2"/>
    <line x1="144" y1="144" x2="140" y2="170" stroke-width="5"/>
    <path d="M128 112 L192 112 L180 146 L138 146 Z" fill="#5f8fb0"/>
    <line x1="112" y1="116" x2="132" y2="120" stroke="#222" stroke-width="9"/>
    <line x1="112" y1="116" x2="132" y2="120" stroke="#a0662b" stroke-width="4"/>

    <!-- Braço segurando o carrinho -->
    <path d="M56 96 L112 116" stroke="#222" stroke-width="16"/>
    <path d="M56 96 L112 116" stroke="#f5c38b" stroke-width="9"/>
    <circle cx="112" cy="116" r="8" fill="#f5c38b"/>
